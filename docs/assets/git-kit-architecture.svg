<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="git-kit 架构：三条入口、一个意图路由、九个分支与共享资产">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="860" fill="#ffffff"/>
  <text x="40" y="56" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#0f172a">git-kit：三条入口，一个实现</text>
  <text x="40" y="84" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">斜杠命令与自然语言都只是入口；路由与流程逻辑只存在于 skill 中，命令侧不复制判定。</text>

  <!-- 入口层 -->
  <rect class="node" x="40" y="200" width="280" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="180" y="236" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#0f172a">opencode 斜杠 /git/*</text>

  <rect class="node" x="40" y="368" width="280" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="180" y="404" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#0f172a">dsh 斜杠 /git-*</text>

  <rect class="node" x="40" y="536" width="280" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="180" y="572" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#0f172a">自然语言描述</text>

  <!-- 路由层 -->
  <rect class="node" x="400" y="120" width="260" height="616" rx="12" fill="#0f172a" stroke="#0f172a"/>
  <text x="530" y="400" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#ffffff">SKILL.md</text>
  <text x="530" y="428" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" fill="#cbd5e1">意图路由</text>
  <text x="530" y="456" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">按需加载子文件</text>
  <text x="530" y="480" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">唯一真源</text>

  <!-- 入口到路由 -->
  <path class="edge" d="M320 232 L400 232" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M320 400 L400 400" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M320 568 L400 568" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 分支层 -->
  <rect class="node" x="740" y="120" width="320" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="760" y="145" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">commit-push</text>
  <text x="760" y="165" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">references/commit-push.md</text>
  <rect class="node" x="740" y="190" width="320" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="760" y="215" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">commit-message</text>
  <text x="760" y="235" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">references/commit-message.md</text>
  <rect class="node" x="740" y="260" width="320" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="760" y="285" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">branch</text>
  <text x="760" y="305" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">references/branch.md</text>
  <rect class="node" x="740" y="330" width="320" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="760" y="355" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">pr-create</text>
  <text x="760" y="375" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">references/pr-create.md</text>
  <rect class="node" x="740" y="400" width="320" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="760" y="425" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">pr-merge</text>
  <text x="760" y="445" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">references/pr-merge.md</text>
  <rect class="node" x="740" y="470" width="320" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="760" y="495" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">tag</text>
  <text x="760" y="515" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">references/tag.md</text>
  <rect class="node" x="740" y="540" width="320" height="56" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="760" y="565" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#065f46">release</text>
  <text x="760" y="585" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">references/release.md</text>
  <rect class="node" x="740" y="610" width="320" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="760" y="635" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">slim</text>
  <text x="760" y="655" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">references/slim.md</text>
  <rect class="node" x="740" y="680" width="320" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="760" y="705" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">star-classify</text>
  <text x="760" y="725" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">references/star-classify.md</text>

  <!-- 路由到分支 -->
  <path class="edge" d="M660 148 L740 148" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M660 218 L740 218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M660 288 L740 288" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M660 358 L740 358" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M660 428 L740 428" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M660 498 L740 498" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M660 568 L740 568" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M660 638 L740 638" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M660 708 L740 708" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 底部共享资产说明（注记，不是节点） -->
  <rect x="40" y="796" width="1360" height="44" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-dasharray="5 4"/>
  <text x="64" y="823" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#78350f">共享判定：references/stable-branch.md（commit-push / pr-merge / tag / release 共用）　脚本：release-preflight.sh · changelog.sh · git-slim.sh · git-star.sh</text>

  <!-- 右侧列标注 -->
  <text x="1100" y="148" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">「意图路由」</text>
  <text x="1100" y="170" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">命中唯一分支后，</text>
  <text x="1100" y="192" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">才加载对应 references/</text>
  <text x="1100" y="300" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">未命中任何信号 →</text>
  <text x="1100" y="322" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">停止并询问，不擅自动手</text>
</svg>
