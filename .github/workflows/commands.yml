name: commands

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: 命令契约（本仓）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 契约 / README / $ARGUMENTS 校验
        run: node scripts/check-opencode-commands.mjs

      - name: disk-cleanup 编码表一致性
        run: node scripts/check-disk-cleanup-codes.mjs

      - name: disk-cleanup 安全不变量（删除漏斗 / 禁 bash4 / HOME 断言 / 变量+中文）
        run: node scripts/check-disk-cleanup-safety.mjs

      - name: disk-cleanup 测试（纯 bash，假 HOME，禁碰真实用户数据）
        run: bash skills/disk-cleanup/scripts/tests/run.sh

      - name: tech-design 文档门禁回归
        run: node skills/tech-design/scripts/tests/check-design-doc-test.mjs

      - name: 脚本语法（安装脚本 + 技能脚本）
        run: |
          files=$(find scripts skills -name '*.sh' -type f | sort)
          for f in ${files}; do
            echo "bash -n ${f}"
            bash -n "${f}"
          done

  dsh-parity:
    name: 与 dsh-commands 的分支契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 另一仓只读比对：branch/skill 不一致判失败，description 差异只提示。
      - uses: actions/checkout@v4
        with:
          repository: morehao/dsh-commands
          path: .ci/dsh-commands

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # dsh-commands v0.4.0 起仓库只提交 TS 源码（lib/*.ts，dist/ 不入库），比对前先构建出 dist/index.js。
      - name: Build dsh-commands（TS → dist）
        working-directory: .ci/dsh-commands
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: 跨仓比对「命令 → skill 分支」
        run: node scripts/check-opencode-commands.mjs --dsh .ci/dsh-commands
